<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your Bond 💞 — BondPoints</title>
<link rel="stylesheet" href="css/cute.css">
<style>
  .setup-wrap { min-height: calc(100vh - 130px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; position: relative; z-index: 1; }
  .setup-card { width: 100%; max-width: 520px; text-align: center; }
  .setup-card h1 { color: var(--pink-dark); font-size: 1.8rem; margin-bottom: 6px; }
  .setup-card .sub { color: var(--ink-soft); margin-bottom: 24px; font-size: .98rem; }
  .setup-card form { text-align: left; }
  .setup-emoji { font-size: 2.6rem; margin-bottom: 10px; display: inline-block; animation: floaty 3s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .rel-pills { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .rel-pill { flex: 1 1 30%; min-width: 110px; }
  .rel-pill input { display: none; }
  .rel-pill span {
    display: block; text-align: center; padding: 12px 8px; border-radius: 16px;
    border: 2px solid var(--pink-pale); background: #fffdfd; cursor: pointer;
    font-weight: 700; font-size: .92rem; transition: all .2s ease;
  }
  .rel-pill input:checked + span {
    border-color: var(--pink); background: var(--pink-pale); color: var(--pink-dark);
    box-shadow: 0 6px 16px rgba(255,107,158,.25); transform: translateY(-2px);
  }
</style>
</head>
<body>
<canvas id="heartsCanvas"></canvas>

<nav class="bp-nav">
  <a class="bp-logo" href="index.html"><span class="logo-heart">💗</span> BondPoints</a>
  <button class="nav-toggle" aria-label="Menu">☰</button>
  <div class="bp-nav-links">
    <a href="index.html">Home</a>
    <button class="linklike" id="logoutBtn">Logout</button>
  </div>
</nav>

<div class="setup-wrap">
  <div class="card setup-card">
    <span class="setup-emoji">💞</span>
    <h1>Create your Bond</h1>
    <p class="sub">Tell us about your special someone ✨</p>
    <form id="bondForm">
      <div class="field-row">
        <div class="field">
          <label for="yourName">Your name</label>
          <input type="text" id="yourName" placeholder="You 💗" required>
        </div>
        <div class="field">
          <label for="partnerName">Their name</label>
          <input type="text" id="partnerName" placeholder="Them 💕" required>
        </div>
      </div>
      <div class="field">
        <label>What are you two? 💭</label>
        <div class="rel-pills">
          <label class="rel-pill"><input type="radio" name="relationshipType" value="romantic" checked><span>💑 Romantic</span></label>
          <label class="rel-pill"><input type="radio" name="relationshipType" value="friendship"><span>👯 Besties</span></label>
          <label class="rel-pill"><input type="radio" name="relationshipType" value="family"><span>👨‍👩‍👧 Family</span></label>
        </div>
      </div>
      <div class="field">
        <label for="startDate">When did it start? 🌸</label>
        <input type="date" id="startDate">
      </div>
      <button type="submit" class="bp-btn bp-btn-block" id="bondSubmit">💞 Create our bond</button>
    </form>
  </div>
</div>

<footer class="bp-footer">
  <div class="hearts">💗 💕 💖 💕 💗</div>
  <p class="mt-1">Made with love · BondPoints © 2026</p>
</footer>

<script src="js/common.js"></script>
<script>
  bpHearts('heartsCanvas', 20);
  if (!bpRequireAuth()) { /* redirected to login */ }

  document.getElementById('logoutBtn').addEventListener('click', bpLogout);

  document.getElementById('bondForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('bondSubmit');
    const yourName = document.getElementById('yourName').value.trim();
    const partnerName = document.getElementById('partnerName').value.trim();
    const relationshipType = document.querySelector('input[name="relationshipType"]:checked').value;
    const startDate = document.getElementById('startDate').value || null;
    btn.disabled = true; btn.textContent = 'Creating your bond... 💭';
    try {
      const { ok, data } = await bpApi('/api/bonds', {
        method: 'POST', body: JSON.stringify({ yourName, partnerName, relationshipType, startDate })
      });
      if (ok) {
        bpToast('Your bond is created! 💞', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 700);
      } else {
        bpToast(data && data.message ? data.message : 'Could not create bond 🥺', 'error');
      }
    } catch (err) {
      bpToast('Could not reach the server. Try again in a moment.', 'error');
    }
    btn.disabled = false; btn.textContent = '💞 Create our bond';
  });
</script>
</body>
</html>
