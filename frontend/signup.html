<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join BondPoints 💗 — Create your account</title>
<link rel="stylesheet" href="css/cute.css">
<style>
  .auth-wrap { min-height: calc(100vh - 130px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; position: relative; z-index: 1; }
  .auth-card { width: 100%; max-width: 440px; text-align: center; }
  .auth-card h1 { color: var(--pink-dark); font-size: 1.8rem; margin-bottom: 6px; }
  .auth-card .sub { color: var(--ink-soft); margin-bottom: 24px; font-size: .98rem; }
  .auth-card form { text-align: left; }
  .auth-emoji { font-size: 2.6rem; margin-bottom: 10px; animation: floaty 3s ease-in-out infinite; display: inline-block; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .login-switch { text-align: center; margin-top: 16px; color: var(--ink-soft); font-size: .95rem; }
  .login-switch a { color: var(--pink-dark); font-weight: 700; }
  .back-link { display: inline-block; margin-top: 18px; color: var(--ink-soft); font-weight: 600; font-size: .92rem; text-decoration: none; }
  .back-link:hover { color: var(--pink-dark); }
</style>
</head>
<body>
<canvas id="heartsCanvas"></canvas>

<nav class="bp-nav">
  <a class="bp-logo" href="index.html"><span class="logo-heart">💗</span> BondPoints</a>
  <button class="nav-toggle" aria-label="Menu">☰</button>
  <div class="bp-nav-links">
    <a href="index.html">Home</a>
    <a href="index.html?login=1">Login</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="card auth-card">
    <span class="auth-emoji">💕</span>
    <h1>Join BondPoints</h1>
    <p class="sub">Start your love story in under a minute ✨</p>
    <form id="signupForm">
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" placeholder="e.g. Aisha" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters 💭" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="bp-btn bp-btn-block" id="signupSubmit">💗 Create my account</button>
    </form>
    <p class="login-switch">Already have an account? <a href="index.html?login=1">Login 💗</a></p>
    <a class="back-link" href="index.html">← Back to home</a>
  </div>
</div>

<footer class="bp-footer">
  <div class="hearts">💗 💕 💖 💕 💗</div>
  <p class="mt-1">Made with love · BondPoints © 2026</p>
</footer>

<script src="js/common.js"></script>
<script>
  bpHearts('heartsCanvas', 20);

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('signupSubmit');
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (password.length < 6) { bpToast('Password needs at least 6 characters 🥺', 'error'); return; }
    btn.disabled = true; btn.textContent = 'Creating your account... 💭';
    try {
      const { ok, data } = await bpApi('/api/auth/signup', {
        method: 'POST', body: JSON.stringify({ name, email, password })
      });
      if (ok && data.token) {
        bpSetToken(data.token);
        bpToast('Welcome to BondPoints! 💗', 'success');
        setTimeout(() => { window.location.href = data.redirectUrl || 'bond-setup.html'; }, 600);
      } else {
        bpToast(data && data.message ? data.message : 'Signup failed 🥺', 'error');
      }
    } catch (err) {
      bpToast('Could not reach the server. Try again in a moment.', 'error');
    }
    btn.disabled = false; btn.textContent = '💗 Create my account';
  });
</script>
</body>
</html>
